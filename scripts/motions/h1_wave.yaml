fps: 50
duration_s: 4.0

# 参考轨迹“渐入”时间（秒）。避免在 t=0 发生突变导致摔倒。
ramp_in_s: 1.0

# 参考轨迹以“默认关节角”为基准生成 delta（单位：rad）
# ref_joint_pos(t) = default_joint_pos + delta(t)
#
# pattern 使用正则去匹配 H1 的关节名（避免不同 USD 版本命名差异）。
# 建议先用很保守的幅度，确认不会打到限位再逐步加大。
joints:
  # 关节匹配规则按你工程里 H1 的 actuator regex 来写（见 isaaclab_assets/robots/unitree.py）：
  # - ".*_shoulder_pitch", ".*_elbow" 等
  # 默认会匹配左右两侧同名关节（如果你只想单臂，后续可以把 pattern 改成更具体的 left/right 前缀）。

  # 肩关节：缓慢抬手/放手
  - pattern: ".*_shoulder_pitch"
    amplitude: 0.20
    frequency_hz: 0.6
    phase_rad: 0.0
    bias: 0.0

  # 肘关节：随肩一起小幅摆动（从 0 开始，避免 t=0 的突变）
  - pattern: ".*_elbow"
    amplitude: 0.25
    frequency_hz: 0.6
    phase_rad: 0.0
    bias: 0.0


