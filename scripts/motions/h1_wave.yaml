fps: 50
duration_s: 4.0

# 参考轨迹以“默认关节角”为基准生成 delta（单位：rad）
# ref_joint_pos(t) = default_joint_pos + delta(t)
#
# pattern 使用正则去匹配 H1 的关节名（避免不同 USD 版本命名差异）。
# 建议先用很保守的幅度，确认不会打到限位再逐步加大。
joints:
  # 肩关节：前后摆动（抬手/放手）
  - pattern: ".*_shoulder_pitch"
    amplitude: 0.35
    frequency_hz: 0.8
    phase_rad: 0.0
    bias: 0.0

  # 肘关节：配合做“挥手”感觉
  - pattern: ".*_elbow"
    amplitude: 0.55
    frequency_hz: 0.8
    phase_rad: 1.57079632679   # pi/2
    bias: 0.0

